name: Build Real QEMU NexusVM IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: brew install xcodegen meson ninja pkg-config glib pixman libpng jpeg-turbo

      - name: Cache Prebuilt iOS QEMU Frameworks
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: ios-qemu-arm64-v1

      - name: Build iOS QEMU Shared Libraries
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          mkdir -p Frameworks/lib Frameworks/include
          git clone --depth 1 --branch v9.2.0 https://github.com qemu-src
          cd qemu-src
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          ./configure \
            --cross-prefix="" \
            --cc="clang -arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=27.0" \
            --cxx="clang++ -arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=27.0" \
            --host=aarch64-apple-darwin \
            --target-list=aarch64-softmmu,x86_64-softmmu \
            --enable-shared-lib \
            --enable-tcg \
            --enable-vnc \
            --disable-bsd-user \
            --disable-linux-user \
            --disable-docs \
            --disable-tools \
            --disable-guest-agent \
            --disable-capstone \
            --disable-slirp \
            --prefix="$GITHUB_WORKSPACE/Frameworks"
          ninja -C build
          ninja -C build install
          cd ..
          rm -rf qemu-src

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Release App
        run: |
          xcodebuild \
            -project NexusVM.xcodeproj \
            -scheme NexusVM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NexusVM.app Payload/
          zip -r NexusVM.ipa Payload

      - name: Upload NexusVM IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusVM-QEMU-ipa
          path: NexusVM.ipa
