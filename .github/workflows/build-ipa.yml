name: Build Real QEMU NexusVM IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & Build Tools
        run: brew install xcodegen wget

      - name: Download Precompiled iOS QEMU + SPICE Sysroot
        run: |
          mkdir -p Frameworks
          curl -L "https://github.com" -o Sysroot.tar.gz
          tar -xzf Sysroot.tar.gz -C Frameworks/
          rm Sysroot.tar.gz

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Release App
        run: |
          xcodebuild \
            -project NexusVM.xcodeproj \
            -scheme NexusVM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NexusVM.app Payload/
          zip -r NexusVM.ipa Payload

      - name: Upload NexusVM IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusVM-QEMU-ipa
          path: NexusVM.ipa
