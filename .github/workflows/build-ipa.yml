name: Build Real QEMU NexusVM IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & Build Tools
        run: |
          brew install xcodegen meson ninja pkg-config cmake nasm bison flex gettext autoconf automake libtool
          pip3 install --break-system-packages six pyparsing setuptools distlib

      - name: Cache Prebuilt iOS QEMU Sysroot
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: utm-ios-sysroot-v1

      - name: Checkout UTM Source for iOS Sysroot Builder
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: utmapp/UTM
          path: utm-src
          submodules: true
          fetch-depth: 1

      - name: Build iOS QEMU + SPICE Sysroot
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          cd utm-src
          NCPU=0 ./scripts/build_dependencies.sh -p ios -a arm64
          cd ..
          rm -rf Frameworks
          mv utm-src/Sysroot-ios-arm64 Frameworks
          rm -rf utm-src

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned Release App
        run: |
          xcodebuild \
            -project NexusVM.xcodeproj \
            -scheme NexusVM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NexusVM.app Payload/
          zip -r NexusVM.ipa Payload

      - name: Upload NexusVM IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusVM-QEMU-ipa
          path: NexusVM.ipa
