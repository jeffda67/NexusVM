
name: Build Real QEMU NexusVM IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Prebuilt iOS QEMU Sysroot
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: utm-ios-sysroot-v4

      - name: Checkout UTM Source for iOS Sysroot Builder
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: utmapp/UTM
          path: utm-src
          submodules: recursive
          fetch-depth: 1

      - name: Install All Build Dependencies
        run: |
          brew install xcodegen meson ninja pkg-config cmake nasm bison flex gettext autoconf automake libtool coreutils llvm spirv-llvm-translator libxcb libxrandr glib-utils libgpg-error

          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --break-system-packages \
            six \
            pyparsing \
            setuptools \
            distlib \
            pyyaml \
            packaging \
            tomli \
            mako \
            markupsafe \
            ply \
            jinja2 \
            lxml

      - name: Verify Build Environment
        run: |
          echo "=== macOS ==="
          sw_vers

          echo "=== Xcode ==="
          xcodebuild -version

          echo "=== Python ==="
          python3 --version

          echo "=== Build Tools ==="
          meson --version
          ninja --version
          cmake --version
          pkg-config --version

          echo "=== sed ==="
          command -v sed
          sed --version 2>/dev/null || true

      - name: Patch UTM Missing IOMedia Header Removal
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          python3 <<'PY'
          from pathlib import Path

          script = Path("utm-src/scripts/build_dependencies.sh")

          if not script.exists():
              raise SystemExit("ERROR: UTM dependency script was not found.")

          content = script.read_text()

          original = 'rm "$OUTPUT_INCLUDES/IOKit/storage/IOMedia.h"'
          fixed = 'rm -f "$OUTPUT_INCLUDES/IOKit/storage/IOMedia.h"'

          if original in content:
              content = content.replace(original, fixed, 1)
              script.write_text(content)
              print("Patched IOMedia.h removal to tolerate a missing file.")
          elif fixed in content:
              print("IOMedia.h removal is already patched.")
          else:
              raise SystemExit(
                  "ERROR: Could not locate the expected IOMedia.h removal command. "
                  "UTM's dependency script may have changed."
              )
          PY

      - name: Build iOS QEMU and SPICE Sysroot
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          set -e

          cd utm-src

          echo "=== Verify UTM dependency script ==="
          test -f scripts/build_dependencies.sh
          chmod +x scripts/build_dependencies.sh

          echo "=== Build iOS ARM64 dependencies ==="
          NCPU=0 ./scripts/build_dependencies.sh -p ios -a arm64

          cd ..

          echo "=== Verify generated sysroot ==="
          test -d utm-src/sysroot-iOS-arm64

          rm -rf Frameworks
          mv utm-src/sysroot-iOS-arm64 Frameworks

          test -d Frameworks

          echo "=== Sysroot successfully generated ==="
          ls -lah Frameworks

      - name: Verify QEMU Sysroot
        run: |
          if [ ! -d Frameworks ]; then
            echo "ERROR: Frameworks sysroot is missing."
            exit 1
          fi

          echo "Sysroot found:"
          ls -lah Frameworks

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          test -d NexusVM.xcodeproj

      - name: Build Unsigned Release App
        run: |
          set -o pipefail

          xcodebuild \
            -project NexusVM.xcodeproj \
            -scheme NexusVM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify App Build
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/NexusVM.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: NexusVM.app was not produced."
            echo "Searching build directory for app bundles:"
            find build -name "*.app" -maxdepth 8 || true
            exit 1
          fi

          echo "App successfully built:"
          ls -lah "$APP_PATH"

      - name: Package Unsigned IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/NexusVM.app"

          test -d "$APP_PATH"

          rm -rf Payload NexusVM.ipa
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -r NexusVM.ipa Payload

          echo "=== IPA verification ==="
          test -f NexusVM.ipa
          ls -lh NexusVM.ipa
          unzip -t NexusVM.ipa

      - name: Upload NexusVM IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusVM-QEMU-ipa
          path: NexusVM.ipa
          if-no-files-found: error
          retention-days: 14
