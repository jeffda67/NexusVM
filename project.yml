name: NexusVM
options:
  bundleIdPrefix: com.nexusvm
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: "NexusVM"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  NexusVM:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: NexusVM
        excludes:
          - "Info.plist"
          - "NexusVM.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.nexusvm.app"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        INFOPLIST_FILE: "NexusVM/Info.plist"
        CODE_SIGN_ENTITLEMENTS: "NexusVM/NexusVM.entitlements"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      gatherCoverageData: false
