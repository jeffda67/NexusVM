name: NexusVM
options:
  bundleIdPrefix: com.nexusvm
  deploymentTarget:
    iOS: "27.0"

targets:
  NexusVM:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: NexusVM
    info:
      path: NexusVM/Info.plist
    entitlements:
      path: NexusVM/NexusVM.entitlements
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: "com.nexusvm.app"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks/lib $(PROJECT_DIR)/Frameworks/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks/include $(PROJECT_DIR)/Frameworks/include/glib-2.0 $(PROJECT_DIR)/Frameworks/lib/glib-2.0/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks/lib"
        OTHER_LDFLAGS: "$(inherited) -lc++ -lz -liconv -lresolv"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
